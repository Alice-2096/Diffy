[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diffy"
version = "0.1.0"
description = "Compliance-conscious, RAG-assisted infrastructure review"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alice Jiang" }]
dependencies = []

[project.optional-dependencies]
github = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "unidiff>=0.7,<1",
]
rag = [
  "qdrant-client>=1.12,<2",
  "sentence-transformers>=3.2,<4",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
diffy = "diffy.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
